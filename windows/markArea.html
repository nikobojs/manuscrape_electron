<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    />
    <title>Mark area</title>
    <script>
      window.electronAPI?.useP5Script(() => {
        console.log("p5 script loaded");
      });
      window.electronAPI?.useP5Sketch(() => {
        console.log("p5 sketch loaded - init overlay");
        window?.initOverlay();
      });
    </script>
    <style type="text/css">
      body,
      html {
        margin: 0;
        overflow: hidden;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      .mark-area-overlay {
        cursor: crosshair;
      }
    </style>
  </head>
  <body></body>
</html>
