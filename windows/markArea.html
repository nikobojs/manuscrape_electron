<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    />
    <title>Mark area</title>
    <script>
      window.electronAPI?.useP5Script(() => {
        window?.initOverlay();
      });
    </script>

      body,
      html {
        margin: 0;
        overflow: hidden;
        padding: 0;

      }

      label,
      span,
      input {
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      }

      .mark-area-overlay {
        cursor: crosshair;
      }
    </style>
  </head>
  <body class="mark-area-overlay">
    <script src="../renderers/markAreaP5Sketch.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {});
    </script>
